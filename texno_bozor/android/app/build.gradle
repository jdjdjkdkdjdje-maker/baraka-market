plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    // Flutter Gradle Plugin — Flutter SDK ichidan yuklanadi
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "uz.texnobozor.app"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        applicationId "uz.texnobozor.app"
        minSdkVersion 23
        targetSdkVersion flutter.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            // Hozircha debug kalit bilan imzolanadi (o'rnatish uchun yetarli).
            // Keyinchalik Play Market uchun alohida release keystore qo'shiladi.
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}
