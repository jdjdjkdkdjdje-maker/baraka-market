name: texno_bozor
description: "TEXNO BOZOR — offline-first elektronika marketplace (Flutter, Android APK)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Holat boshqaruvi
  flutter_riverpod: ^2.6.1

  # Lokal ma'lumotlar bazasi (SQLite)
  sqflite: ^2.4.1
  path: ^1.9.0

  # Tarmoq — faqat TEXNO AI va ixtiyoriy REST rejimi uchun
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Testlarda SQLite ni desktopda ishga tushirish uchun
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  assets:
    - assets/categories/
    - assets/banners/
