name: texno_bozor
description: "TEXNO BOZOR — offline-first elektronika marketplace ilovasi (Flutter)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigatsiya
  go_router: ^14.6.2

  # Lokal ma'lumotlar bazasi (SQLite + Drift)
  drift: ^2.20.3
  drift_flutter: ^0.2.0

  # Tarmoq (faqat TEXNO AI uchun)
  dio: ^5.7.0

  # Xavfsiz lokal saqlash (API kalit va h.k.)
  flutter_secure_storage: ^9.2.2

  # Rasmlarni lokal keshlash
  cached_network_image: ^3.4.1

  # Internet holatini kuzatish
  connectivity_plus: ^6.1.0

  # Konfiguratsiya (.env)
  flutter_dotenv: ^5.2.1

  # Identifikatorlar
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.20.3

  # Testlarda xotiradagi (in-memory) SQLite bazasi uchun
  sqlite3: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/categories/
