name: TEXNO BOZOR APK

on:
  push:
    branches:
      - "arena/019ff0b8-baraka-market"
      - main
    paths:
      - "texno_bozor/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Flutter release APK build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: texno_bozor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable

      - name: Android litsenziyalari
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Pub get
        run: flutter pub get

      - name: Drift codegen
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analiz
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Release APK build
        run: flutter build apk --release

      - name: APK ni tayyorlash
        working-directory: .
        run: |
          cp texno_bozor/build/app/outputs/flutter-apk/app-release.apk texno-bozor.apk
          ls -lh texno-bozor.apk

      - name: Artefakt sifatida saqlash
        uses: actions/upload-artifact@v4
        with:
          name: texno-bozor-apk
          path: texno-bozor.apk
          retention-days: 30

      - name: Release'ga chiqarish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: texno-apk-v${{ github.run_number }}
          name: "TEXNO BOZOR APK #${{ github.run_number }}"
          body: |
            📱 **texno-bozor.apk** — TEXNO BOZOR elektronika marketplace ilovasi.

            O'rnatish: APK faylni telefonga yuklab oching.
            "Noma'lum manbalar" so'ralsa — ruxsat bering.

            Ilova to'liq offline ishlaydi (internet faqat TEXNO AI uchun kerak).
          files: texno-bozor.apk
          make_latest: true
